[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-assistant-elevenlabs"
version = "0.1.0"
description = "Assistente virtual por voz com ElevenLabs e Claude"
requires-python = ">=3.10"

[project.scripts]
voice-assistant = "voice_assistant.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
